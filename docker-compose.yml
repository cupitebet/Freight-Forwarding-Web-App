# Lingkungan lokal: PostgreSQL + API. Salin .env.example ke .env dulu.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ff
      POSTGRES_PASSWORD: ff
      POSTGRES_DB: ff
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ff"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/src/db/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://ff:ff@db:5432/ff
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://ff:ff@db:5432/ff
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  db-data:
